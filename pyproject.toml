[project]
name = "stepcheck"
version = "0.3.0"
description = "Verify a student's algebra one line at a time with a computer algebra system, and name the classic mistake behind a wrong line."
readme = "README.md"
license = "MIT"
authors = [{ name = "Raphaël Kanapitsas", email = "raphaelkanapitsas@icloud.com" }]
requires-python = ">=3.11"
dependencies = ["sympy>=1.13"]
keywords = ["math", "education", "algebra", "sympy", "tutoring", "verification"]
classifiers = [
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
]

[project.scripts]
stepcheck = "stepcheck.cli:main"

[project.urls]
Repository = "https://github.com/kanapitsas/stepcheck"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]
